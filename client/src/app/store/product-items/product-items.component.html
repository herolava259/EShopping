<div class="card h-100 shadow-sm" *ngIf="product">
    <div class="image position-relative" style="cursor: pointer">
        <img src="{{product.imageFile}}" alt="{{product.name}}" class="img-fluid bg-light">
        <button (click)="addItemToBasket()" class="btn btn-primary fa fa-shopping-cart mr-2"></button>
        <button routerLink="/store/{{product.id}}" class="btn btn-">View</button>
    </div>
    <div class="card-body d-flex flex-column">
        <a href="#">
            <h6 class="text-uppercase">
                {{product.name}}
            </h6>
        </a>
        <span class="mb-2">{{product.price | currency:'INR'}}</span>
    </div>
</div>
